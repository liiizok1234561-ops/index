<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Журнал передачи смен</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>">
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#eef2f7;color:#172033}
    button,input,select{font:inherit}
    button{cursor:pointer}
    .hidden{display:none!important}
    .overlay{position:fixed;inset:0;background:rgba(15,23,42,.92);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9999}
    .modal{width:min(390px,100%);background:#fff;border-radius:24px;padding:26px;box-shadow:0 24px 80px rgba(0,0,0,.3);text-align:center}
    .modal-icon{font-size:48px}
    .modal h2{margin:8px 0 4px;font-size:22px}
    .modal p{margin:0 0 16px;color:#64748b;font-size:14px}
    .modal input{width:100%;padding:14px;border:2px solid #e2e8f0;border-radius:14px;text-align:center;font-size:17px}
    .modal input:focus{outline:0;border-color:#2563eb}
    .error{min-height:20px;margin-top:8px;color:#dc2626;font-size:13px}
    .spinner{width:26px;height:26px;border:3px solid #dbe3ef;border-top-color:#2563eb;border-radius:50%;animation:spin .8s linear infinite;margin:16px auto}
    @keyframes spin{to{transform:rotate(360deg)}}

    .page{width:min(1000px,calc(100% - 20px));margin:10px auto 40px;background:#fff;border-radius:22px;box-shadow:0 8px 30px rgba(15,23,42,.08);overflow:hidden}
    .header{padding:16px 18px;border-bottom:1px solid #e8edf4;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
    .brand{display:flex;align-items:center;gap:10px}
    .brand-icon{font-size:30px}
    .brand h1{font-size:19px;margin:0}
    .brand small{display:block;color:#8a98aa;margin-top:2px}
    .header-actions{display:flex;gap:7px;flex-wrap:wrap}
    .content{padding:16px}
    .grid{display:grid;grid-template-columns:1.3fr .8fr .7fr .8fr;gap:10px}
    .field label{display:block;font-size:12px;font-weight:700;color:#586579;margin-bottom:4px}
    .field input,.field select,.search{width:100%;border:1px solid #d8e0ea;border-radius:11px;padding:11px 12px;background:#fff}
    .field input:focus,.field select:focus,.search:focus{outline:0;border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.1)}
    .toolbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:#f3f6fa;padding:8px;border-radius:11px;margin-top:12px}
    .toolbar button{border:1px solid #d4dce7;background:#fff;border-radius:8px;min-height:38px;padding:7px 11px}
    .toolbar button.active{background:#2563eb;color:#fff;border-color:#2563eb}
    .sep{color:#b1bac7}
    #editor{min-height:150px;border:1px solid #d8e0ea;border-radius:11px;padding:12px;margin-top:8px;line-height:1.65;outline:0}
    #editor:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.1)}
    #editor.editing{border-color:#8b5cf6;box-shadow:0 0 0 3px rgba(139,92,246,.12)}
    .pin-row{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px;color:#475569}
    .actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
    .btn{border:0;border-radius:12px;padding:10px 15px;font-weight:700;min-height:42px;display:inline-flex;align-items:center;justify-content:center;gap:5px}
    .btn-dark{background:#172033;color:#fff}
    .btn-primary{background:#2563eb;color:#fff}
    .btn-light{background:#f3f6fa;color:#27364a;border:1px solid #dce3ec}
    .btn-danger{background:#fee2e2;color:#991b1b}
    .btn-warning{background:#fef3c7;color:#92400e}
    .btn-success{background:#dcfce7;color:#166534}
    .btn:disabled{opacity:.55;cursor:not-allowed}
    .list-top{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin-top:22px}
    .list-title h2{font-size:17px;margin:0}
    .status-line{font-size:12px;color:#7a8899;margin-top:3px}
    .search-wrap{min-width:260px}
    .filters{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}
    .filter{border:1px solid #dbe2eb;background:#fff;color:#475569;border-radius:999px;padding:7px 11px;font-size:13px}
    .filter.active{background:#172033;color:#fff;border-color:#172033}
    .empty{padding:36px;text-align:center;color:#94a3b8}
    .date-group{border:1px solid #e1e7ef;border-radius:13px;overflow:hidden;margin-bottom:11px}
    .date-head{display:flex;align-items:center;justify-content:space-between;padding:13px 15px;background:#f8fafc;cursor:pointer}
    .date-head:hover{background:#f3f6fa}
    .date-label{font-weight:800}
    .date-meta{display:flex;align-items:center;gap:9px;color:#708094;font-size:13px}
    .arrow{transition:transform .2s}
    .arrow.closed{transform:rotate(-90deg)}
    .date-items{padding:10px;background:#fff}
    .date-items.closed{display:none}
    .card{border:1px solid #e2e8f0;border-radius:12px;padding:12px;margin-bottom:9px;position:relative}
    .card:last-child{margin-bottom:0}
    .card.pinned{border-color:#f6c453;background:#fffdf5}
    .card-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
    .person{font-weight:800}
    .nick{display:inline-block;margin-left:5px;padding:3px 9px;border-radius:999px;background:#ede9fe;color:#5b21b6;font-size:12px}
    .badges{display:flex;gap:5px;flex-wrap:wrap}
    .badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:800}
    .urgent{background:#fee2e2;color:#991b1b}
    .in_work{background:#fef3c7;color:#92400e}
    .done{background:#dcfce7;color:#166534}
    .not_done{background:#e2e8f0;color:#334155}
    .pinned-badge{background:#fff3bf;color:#7a4b00}
    .preview{margin-top:8px;color:#334155;cursor:pointer;padding:6px;border-radius:7px}
    .preview:hover{background:#f8fafc}
    .body{display:none;margin-top:7px;padding:11px;background:#f8fafc;border-radius:9px;border-left:3px solid #2563eb;line-height:1.6;overflow-wrap:anywhere}
    .body.show{display:block}
    .body a{color:#2563eb}
    .card-actions{display:flex;justify-content:flex-end;gap:6px;border-top:1px solid #eef2f6;margin-top:9px;padding-top:8px;flex-wrap:wrap}
    .card-actions button{border:0;background:transparent;padding:7px 10px;border-radius:7px}
    .card-actions .edit{color:#2563eb}
    .card-actions .edit:hover{background:#dbeafe}
    .card-actions .delete{color:#dc2626}
    .card-actions .delete:hover{background:#fee2e2}
    .offline{background:#fff7ed;color:#9a3412;border:1px solid #fed7aa;border-radius:10px;padding:9px 11px;font-size:13px;margin-bottom:10px}
    @media(max-width:760px){
      .grid{grid-template-columns:1fr 1fr}
      .list-top{grid-template-columns:1fr}
      .search-wrap{min-width:0}
    }
    @media(max-width:480px){
      .page{width:100%;margin:0;border-radius:0;min-height:100vh}
      .content,.header{padding:12px}
      .grid{grid-template-columns:1fr}
      .header-actions{width:100%}
      .header-actions .btn{flex:1;padding:8px 10px;font-size:12px}
      .actions .btn{flex:1}
      .toolbar button{font-size:13px;padding:6px 9px}
    }
  </style>
</head>
<body>

<div id="loading" class="overlay">
  <div class="modal">
    <div class="modal-icon">📋</div>
    <h2>Журнал передачи смен</h2>
    <p>Подключаемся к общей таблице</p>
    <div class="spinner"></div>
  </div>
</div>

<div id="access" class="overlay hidden">
  <div class="modal">
    <div class="modal-icon">🔐</div>
    <h2>Код доступа</h2>
    <p>Введите общий код, указанный в Apps Script</p>
    <input id="accessKey" type="password" placeholder="Код доступа">
    <div id="accessError" class="error"></div>
    <button id="accessButton" class="btn btn-primary" style="width:100%">Войти</button>
  </div>
</div>

<main id="app" class="page hidden">
  <header class="header">
    <div class="brand">
      <div class="brand-icon">📋</div>
      <div>
        <h1>Журнал передачи смен</h1>
        <small>Общие данные для всех сотрудников</small>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn btn-warning" onclick="loadEntries(true)">🔄 Обновить</button>
      <button class="btn btn-success" onclick="exportData()">📤 Экспорт</button>
      <button class="btn btn-danger" onclick="clearAll()">🗑 Очистить</button>
    </div>
  </header>

  <section class="content">
    <div id="offlineNotice" class="offline hidden">
      Нет связи с таблицей. Показана последняя сохранённая копия.
    </div>

    <div class="grid">
      <div class="field">
        <label>👤 ФИО</label>
        <input id="fullName" placeholder="Иванов Иван">
      </div>
      <div class="field">
        <label>🐾 Кличка</label>
        <input id="nickname" placeholder="Fox">
      </div>
      <div class="field">
        <label>📅 Дата</label>
        <input id="entryDate" type="date">
      </div>
      <div class="field">
        <label>🚦 Статус</label>
        <select id="status">
          <option value="urgent">🔴 Срочно</option>
          <option value="in_work" selected>🟡 В работе</option>
          <option value="done">🟢 Выполнено</option>
          <option value="not_done">⚪ Не выполнено</option>
        </select>
      </div>
    </div>

    <div class="toolbar">
      <button data-command="bold"><b>B</b></button>
      <button data-command="italic"><i>I</i></button>
      <button data-command="underline"><u>U</u></button>
      <span class="sep">|</span>
      <button onclick="insertBulletList()">• Список</button>
      <button onclick="insertNumberList()">1. Список</button>
      <span class="sep">|</span>
      <button onclick="insertLink()">🔗 Ссылка</button>
      <button onclick="removeFormatting()">🧹 Формат</button>
    </div>

    <div id="editor" contenteditable="true" aria-label="Описание"></div>

    <label class="pin-row">
      <input id="pinned" type="checkbox">
      📌 Закрепить запись сверху
    </label>

    <div class="actions">
      <button id="createButton" class="btn btn-dark" onclick="createEntry()">➕ Добавить</button>
      <button id="updateButton" class="btn btn-primary hidden" onclick="updateEntry()">💾 Сохранить изменения</button>
      <button id="cancelButton" class="btn btn-light hidden" onclick="cancelEdit()">❌ Отмена</button>
      <button class="btn btn-light" onclick="clearForm()">🧹 Очистить форму</button>
    </div>

    <div class="list-top">
      <div class="list-title">
        <h2>📖 Записи</h2>
        <div id="syncStatus" class="status-line"></div>
      </div>
      <div class="search-wrap">
        <input id="search" class="search" placeholder="🔍 Поиск по ФИО, кличке или тексту">
      </div>
    </div>

    <div class="filters">
      <button class="filter active" data-filter="all">Все</button>
      <button class="filter" data-filter="urgent">🔴 Срочно</button>
      <button class="filter" data-filter="in_work">🟡 В работе</button>
      <button class="filter" data-filter="done">🟢 Выполнено</button>
      <button class="filter" data-filter="not_done">⚪ Не выполнено</button>
      <button class="filter" data-filter="pinned">📌 Закреплённые</button>
    </div>

    <div id="list"></div>
  </section>
</main>

<script>
  const APPSCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwOWqG8iNLcQF6q51K5Mp8D4MFK_c3ltCAKxNGxY16erf50TuJhwQouWp9IRZDR12SV/exec';

  const CACHE_KEY = 'shiftJournalCacheV2';
  const ACCESS_KEY_STORAGE = 'shiftJournalAccessKey';

  let entries = [];
  let editingId = null;
  let currentFilter = 'all';
  let autoSyncTimer = null;
  let accessKey = localStorage.getItem(ACCESS_KEY_STORAGE) || '';

  const statusLabels = {
    urgent: '🔴 Срочно',
    in_work: '🟡 В работе',
    done: '🟢 Выполнено',
    not_done: '⚪ Не выполнено'
  };

  function today() {
    const date = new Date();
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, '0');
    const day = String(date.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
  }

  function formatDate(date) {
    if (!date) return 'Без даты';
    const parts = date.split('-');
    if (parts.length !== 3) return date;

    const months = [
      'января','февраля','марта','апреля','мая','июня',
      'июля','августа','сентября','октября','ноября','декабря'
    ];

    return `${parts[2]} ${months[Number(parts[1]) - 1]} ${parts[0]}`;
  }

  function escapeHtml(value) {
    const div = document.createElement('div');
    div.textContent = value == null ? '' : String(value);
    return div.innerHTML;
  }

  function htmlToText(html) {
    const div = document.createElement('div');
    div.innerHTML = html || '';
    return (div.textContent || div.innerText || '').replace(/\s+/g, ' ').trim();
  }

  function previewText(html) {
    const text = htmlToText(html);
    if (!text) return '📝 Пустое описание';
    return text.length > 100 ? text.slice(0, 100) + '…' : text;
  }

  function safeId(id) {
    return String(id).replace(/[^a-zA-Z0-9_-]/g, '_');
  }

  function getPayload(action, extra) {
    return Object.assign({
      action,
      key: accessKey
    }, extra || {});
  }

  async function apiGet() {
    const url = new URL(APPSCRIPT_URL);
    url.searchParams.set('action', 'list');

    if (accessKey) {
      url.searchParams.set('key', accessKey);
    }

    const response = await fetch(url.toString(), {
      method: 'GET',
      cache: 'no-store',
      redirect: 'follow'
    });

    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }

    const data = await response.json();

    if (!data.success) {
      throw new Error(data.error || 'Ошибка Apps Script');
    }

    return data;
  }

  async function apiPost(action, extra) {
    const response = await fetch(APPSCRIPT_URL, {
      method: 'POST',
      redirect: 'follow',
      body: JSON.stringify(getPayload(action, extra))
    });

    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }

    const data = await response.json();

    if (!data.success) {
      throw new Error(data.error || 'Ошибка Apps Script');
    }

    return data;
  }

  async function loadEntries(showStatus) {
    if (showStatus) {
      setSyncStatus('⏳ Загружаем данные...');
    }

    try {
      const data = await apiGet();
      entries = Array.isArray(data.entries) ? data.entries : [];
      saveCache();
      document.getElementById('offlineNotice').classList.add('hidden');
      setSyncStatus(`✅ Загружено записей: ${entries.length}`);
      render();
      return true;
    } catch (error) {
      console.error(error);

      if (/код доступа/i.test(error.message)) {
        showAccess();
        return false;
      }

      loadCache();
      document.getElementById('offlineNotice').classList.remove('hidden');
      setSyncStatus(`❌ ${error.message}`);
      render();
      return false;
    }
  }

  function saveCache() {
    localStorage.setItem(CACHE_KEY, JSON.stringify(entries));
  }

  function loadCache() {
    try {
      const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || '[]');
      entries = Array.isArray(cached) ? cached : [];
    } catch (_) {
      entries = [];
    }
  }

  function setSyncStatus(text) {
    document.getElementById('syncStatus').textContent = text;
  }

  function setBusy(busy) {
    document.querySelectorAll('.actions button').forEach(button => {
      button.disabled = busy;
    });
  }

  function readForm() {
    const fullName = document.getElementById('fullName').value.trim();
    const nickname = document.getElementById('nickname').value.trim();
    const date = document.getElementById('entryDate').value;
    const status = document.getElementById('status').value;
    const pinned = document.getElementById('pinned').checked;
    const html = document.getElementById('editor').innerHTML.trim();

    if (!fullName) throw new Error('Введите ФИО');
    if (!date) throw new Error('Укажите дату');
    if (!htmlToText(html)) throw new Error('Добавьте описание');

    return { fullName, nickname, date, status, pinned, html };
  }

  async function createEntry() {
    try {
      const entry = readForm();
      setBusy(true);
      setSyncStatus('⏳ Сохраняем запись...');

      const result = await apiPost('create', { entry });
      entries.unshift(result.entry);
      saveCache();
      clearForm();
      render();
      setSyncStatus('✅ Запись сохранена');
    } catch (error) {
      alert('❌ ' + error.message);
      setSyncStatus('❌ ' + error.message);
    } finally {
      setBusy(false);
    }
  }

  function beginEdit(id) {
    const entry = entries.find(item => item.id === id);
    if (!entry) return;

    editingId = id;

    document.getElementById('fullName').value = entry.fullName || '';
    document.getElementById('nickname').value = entry.nickname || '';
    document.getElementById('entryDate').value = entry.date || today();
    document.getElementById('status').value = entry.status || 'in_work';
    document.getElementById('pinned').checked = Boolean(entry.pinned);
    document.getElementById('editor').innerHTML = entry.html || '';
    document.getElementById('editor').classList.add('editing');

    document.getElementById('createButton').classList.add('hidden');
    document.getElementById('updateButton').classList.remove('hidden');
    document.getElementById('cancelButton').classList.remove('hidden');

    document.getElementById('editor').scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  async function updateEntry() {
    try {
      if (!editingId) return;

      const entry = Object.assign({ id: editingId }, readForm());
      setBusy(true);
      setSyncStatus('⏳ Обновляем запись...');

      const result = await apiPost('update', { entry });
      const index = entries.findIndex(item => item.id === editingId);

      if (index !== -1) {
        entries[index] = result.entry;
      }

      saveCache();
      cancelEdit();
      render();
      setSyncStatus('✅ Запись обновлена');
    } catch (error) {
      alert('❌ ' + error.message);
      setSyncStatus('❌ ' + error.message);
    } finally {
      setBusy(false);
    }
  }

  function cancelEdit() {
    editingId = null;
    document.getElementById('editor').classList.remove('editing');
    document.getElementById('createButton').classList.remove('hidden');
    document.getElementById('updateButton').classList.add('hidden');
    document.getElementById('cancelButton').classList.add('hidden');
    clearForm(false);
  }

  async function deleteEntry(id) {
    if (!confirm('Удалить эту запись?')) return;

    try {
      setSyncStatus('⏳ Удаляем запись...');
      await apiPost('delete', { id });
      entries = entries.filter(item => item.id !== id);
      saveCache();
      render();
      setSyncStatus('✅ Запись удалена');
    } catch (error) {
      alert('❌ ' + error.message);
      setSyncStatus('❌ ' + error.message);
    }
  }

  async function clearAll() {
    if (!confirm('Удалить ВСЕ записи из общей таблицы?')) return;
    if (!confirm('Это действие нельзя отменить. Продолжить?')) return;

    try {
      setSyncStatus('⏳ Очищаем таблицу...');
      await apiPost('clear');
      entries = [];
      saveCache();
      render();
      setSyncStatus('✅ Все записи удалены');
    } catch (error) {
      alert('❌ ' + error.message);
      setSyncStatus('❌ ' + error.message);
    }
  }

  function clearForm(resetEdit = true) {
    document.getElementById('fullName').value = '';
    document.getElementById('nickname').value = '';
    document.getElementById('entryDate').value = today();
    document.getElementById('status').value = 'in_work';
    document.getElementById('pinned').checked = false;
    document.getElementById('editor').innerHTML = '';

    if (resetEdit && editingId) {
      cancelEdit();
    }
  }

  function getFilteredEntries() {
    const query = document.getElementById('search').value.trim().toLowerCase();

    return entries
      .filter(entry => {
        if (currentFilter === 'pinned') return Boolean(entry.pinned);
        if (currentFilter !== 'all') return entry.status === currentFilter;
        return true;
      })
      .filter(entry => {
        if (!query) return true;
        const haystack = [
          entry.fullName,
          entry.nickname,
          htmlToText(entry.html),
          statusLabels[entry.status]
        ].join(' ').toLowerCase();

        return haystack.includes(query);
      })
      .sort((a, b) => {
        if (Boolean(a.pinned) !== Boolean(b.pinned)) {
          return a.pinned ? -1 : 1;
        }

        if (a.date !== b.date) {
          return a.date < b.date ? 1 : -1;
        }

        return String(b.updatedAt || '').localeCompare(String(a.updatedAt || ''));
      });
  }

  function render() {
    const list = document.getElementById('list');
    const filtered = getFilteredEntries();

    if (!filtered.length) {
      list.innerHTML = '<div class="empty">📭 Записи не найдены</div>';
      return;
    }

    const groups = {};

    filtered.forEach(entry => {
      const key = entry.date || '';
      if (!groups[key]) groups[key] = [];
      groups[key].push(entry);
    });

    const dates = Object.keys(groups).sort().reverse();

    list.innerHTML = dates.map(date => {
      const items = groups[date];
      const cards = items.map(renderCard).join('');

      return `
        <section class="date-group">
          <div class="date-head" onclick="toggleDateGroup(this)">
            <span class="date-label">📅 ${escapeHtml(formatDate(date))}</span>
            <span class="date-meta">
              ${items.length} ${entryWord(items.length)}
              <span class="arrow">▼</span>
            </span>
          </div>
          <div class="date-items">${cards}</div>
        </section>
      `;
    }).join('');
  }

  function renderCard(entry) {
    const id = escapeHtml(entry.id);
    const domId = safeId(entry.id);
    const pinClass = entry.pinned ? ' pinned' : '';
    const pinBadge = entry.pinned
      ? '<span class="badge pinned-badge">📌 Закреплено</span>'
      : '';

    return `
      <article class="card${pinClass}">
        <div class="card-top">
          <div>
            <span class="person">${escapeHtml(entry.fullName)}</span>
            ${entry.nickname ? `<span class="nick">${escapeHtml(entry.nickname)}</span>` : ''}
          </div>
          <div class="badges">
            ${pinBadge}
            <span class="badge ${escapeHtml(entry.status)}">
              ${escapeHtml(statusLabels[entry.status] || statusLabels.in_work)}
            </span>
          </div>
        </div>

        <div class="preview" onclick="toggleCard('${domId}', this)">
          ${escapeHtml(previewText(entry.html))}
        </div>

        <div id="body-${domId}" class="body">${entry.html || ''}</div>

        <div class="card-actions">
          <button class="edit" onclick="beginEdit('${id}')">✏️ Редактировать</button>
          <button class="delete" onclick="deleteEntry('${id}')">🗑 Удалить</button>
        </div>
      </article>
    `;
  }

  function entryWord(count) {
    const mod10 = count % 10;
    const mod100 = count % 100;

    if (mod10 === 1 && mod100 !== 11) return 'запись';
    if ([2,3,4].includes(mod10) && ![12,13,14].includes(mod100)) return 'записи';
    return 'записей';
  }

  function toggleDateGroup(head) {
    const items = head.nextElementSibling;
    const arrow = head.querySelector('.arrow');
    items.classList.toggle('closed');
    arrow.classList.toggle('closed');
  }

  function toggleCard(domId, preview) {
    const body = document.getElementById('body-' + domId);
    if (!body) return;

    body.classList.toggle('show');
    preview.textContent = body.classList.contains('show')
      ? '▲ Скрыть описание'
      : preview.dataset.original || preview.textContent;

    if (!preview.dataset.original) {
      preview.dataset.original = previewText(body.innerHTML);
    }

    if (!body.classList.contains('show')) {
      preview.textContent = preview.dataset.original;
    }
  }

  function exportData() {
    const data = getFilteredEntries();

    if (!data.length) {
      alert('Нет записей для экспорта');
      return;
    }

    let text = 'ЖУРНАЛ ПЕРЕДАЧИ СМЕН\n';
    text += '='.repeat(60) + '\n\n';

    data.forEach(entry => {
      text += `${formatDate(entry.date)} | ${entry.fullName}`;
      if (entry.nickname) text += ` (${entry.nickname})`;
      text += ` | ${statusLabels[entry.status] || ''}`;
      if (entry.pinned) text += ' | Закреплено';
      text += '\n';
      text += htmlToText(entry.html) + '\n\n';
    });

    const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `journal_${today()}.txt`;
    link.click();
    URL.revokeObjectURL(link.href);
  }

  function insertBulletList() {
    document.getElementById('editor').focus();
    document.execCommand('insertUnorderedList', false, null);
  }

  function insertNumberList() {
    document.getElementById('editor').focus();
    document.execCommand('insertOrderedList', false, null);
  }

  function insertLink() {
    const url = prompt('Введите ссылку:');
    if (!url) return;

    const clean = url.trim();

    if (!/^https?:\/\//i.test(clean)) {
      alert('Ссылка должна начинаться с http:// или https://');
      return;
    }

    document.getElementById('editor').focus();
    document.execCommand(
      'insertHTML',
      false,
      `<a href="${escapeHtml(clean)}" target="_blank" rel="noopener noreferrer">🔗 Открыть ссылку</a>`
    );
  }

  function removeFormatting() {
    document.getElementById('editor').focus();
    document.execCommand('removeFormat', false, null);
  }

  function showAccess() {
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('app').classList.add('hidden');
    document.getElementById('access').classList.remove('hidden');
    document.getElementById('accessKey').focus();
  }

  async function submitAccess() {
    const input = document.getElementById('accessKey');
    const error = document.getElementById('accessError');
    accessKey = input.value.trim();
    error.textContent = '';

    try {
      const data = await apiGet();
      localStorage.setItem(ACCESS_KEY_STORAGE, accessKey);
      entries = Array.isArray(data.entries) ? data.entries : [];
      saveCache();
      document.getElementById('access').classList.add('hidden');
      document.getElementById('app').classList.remove('hidden');
      render();
      startAutoSync();
    } catch (err) {
      error.textContent = '❌ ' + err.message;
    }
  }

  function startAutoSync() {
    if (autoSyncTimer) clearInterval(autoSyncTimer);

    autoSyncTimer = setInterval(() => {
      if (!editingId && document.visibilityState === 'visible') {
        loadEntries(false);
      }
    }, 10000);
  }

  document.querySelectorAll('[data-command]').forEach(button => {
    button.addEventListener('click', function() {
      const command = this.dataset.command;
      document.getElementById('editor').focus();
      document.execCommand(command, false, null);

      try {
        this.classList.toggle('active', document.queryCommandState(command));
      } catch (_) {}
    });
  });

  document.querySelectorAll('.filter').forEach(button => {
    button.addEventListener('click', function() {
      document.querySelectorAll('.filter').forEach(item => item.classList.remove('active'));
      this.classList.add('active');
      currentFilter = this.dataset.filter;
      render();
    });
  });

  document.getElementById('search').addEventListener('input', render);
  document.getElementById('accessButton').addEventListener('click', submitAccess);
  document.getElementById('accessKey').addEventListener('keydown', event => {
    if (event.key === 'Enter') submitAccess();
  });

  async function init() {
    document.getElementById('entryDate').value = today();

    const connected = await loadEntries(false);

    document.getElementById('loading').classList.add('hidden');

    if (connected) {
      document.getElementById('app').classList.remove('hidden');
      startAutoSync();
    }
  }

  init();
</script>
</body>
</html>
