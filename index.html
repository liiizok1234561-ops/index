<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Журнал передачи смен</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:#f0f2f5;padding:12px;display:flex;justify-content:center;min-height:100vh}
        .app{max-width:850px;width:100%;background:#fff;border-radius:20px;padding:16px;box-shadow:0 4px 20px rgba(0,0,0,0.08)}
        .app-header{display:flex;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px;align-items:center;border-bottom:2px solid #f1f5f9;padding-bottom:10px;gap:8px}
        .app-title{display:flex;align-items:center;gap:10px}
        .app-title .icon{font-size:28px}
        .app-title h1{font-size:18px;color:#1e293b;margin:0;font-weight:700}
        .app-title .subtitle{font-size:11px;color:#94a3b8}
        .row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
        .inp{flex:1 1 140px;min-width:120px}
        .inp label{font-size:11px;color:#666;display:block;margin-bottom:2px;font-weight:600}
        .inp input{width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:10px;font-size:15px;box-sizing:border-box;background:#fff}
        .inp input:focus{border-color:#3b82f6;outline:0;box-shadow:0 0 0 3px rgba(59,130,246,0.1)}
        .toolbar{background:#f1f5f9;padding:8px;border-radius:10px;margin-bottom:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
        .toolbar button{padding:8px 14px;border:1px solid #ccc;background:#fff;border-radius:8px;cursor:pointer;font-size:14px;min-height:40px}
        .toolbar button:hover{background:#e2e8f0}
        .toolbar button.active{background:#3b82f6;color:#fff;border-color:#3b82f6}
        .toolbar .sep{color:#ccc;margin:0 2px}
        #editor{min-height:140px;border:1px solid #ddd;border-radius:10px;padding:12px;outline:0;font-size:15px;background:#fff;line-height:1.7}
        #editor:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,0.1)}
        .btn{padding:10px 20px;border:0;border-radius:20px;font-weight:bold;cursor:pointer;margin:3px;font-size:15px;min-height:44px;display:inline-flex;align-items:center;justify-content:center}
        .btn-blue{background:#1e293b;color:#fff}
        .btn-blue:hover{background:#0f172a}
        .btn-white{background:#fff;border:1px solid #ccc;color:#1e293b}
        .btn-white:hover{background:#f1f5f9}
        .btn-red{background:#fee2e2;color:#991b1b}
        .btn-red:hover{background:#fecaca}
        .btn-green{background:#dcfce7;color:#166534}
        .btn-green:hover{background:#bbf7d0}
        .btn-yellow{background:#fef3c7;color:#92400e}
        .btn-yellow:hover{background:#fde68a}
        .list{margin-top:15px}
        .date-group{border:1px solid #e2e8f0;border-radius:12px;margin-bottom:10px;overflow:hidden}
        .date-header{background:#f8fafc;padding:14px 16px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;min-height:50px}
        .date-header:hover{background:#f1f5f9}
        .date-header .date-label{font-weight:bold;font-size:15px;color:#1e293b}
        .date-header .date-count{font-size:13px;color:#64748b}
        .date-header .date-arrow{font-size:14px;color:#94a3b8;transition:transform 0.3s}
        .date-header .date-arrow.open{transform:rotate(180deg)}
        .date-entries{display:none;padding:10px 12px;background:#fff}
        .date-entries.open{display:block}
        .card{border:1px solid #e2e8f0;border-radius:10px;padding:12px;margin-bottom:8px;background:#fff}
        .card:last-child{margin-bottom:0}
        .card:hover{box-shadow:0 2px 8px rgba(0,0,0,0.06)}
        .card-header{display:flex;justify-content:space-between;flex-wrap:wrap;align-items:center;gap:6px}
        .card-name{font-weight:bold;font-size:15px}
        .card-nick{background:#ede9fe;color:#5b21b6;padding:2px 12px;border-radius:12px;font-size:12px;margin-left:6px;display:inline-block}
        .card-preview{color:#1a1a1a!important;cursor:pointer;margin-top:5px;padding:6px 4px;font-size:14px;border-radius:4px}
        .card-preview:hover{background:#f8fafc}
        .card-body{display:none;margin-top:6px;padding:10px;background:#f8fafc;border-radius:8px;border-left:3px solid #3b82f6;line-height:1.6;color:#1a1a1a;font-size:14px;word-wrap:break-word}
        .card-body.show{display:block}
        .card-body a[target="_blank"]{display:inline-block;padding:8px 16px;background:#eff6ff;border-radius:8px;color:#2563eb;text-decoration:none;font-size:14px;border:1px solid #bfdbfe}
        .card-actions{display:flex;gap:8px;margin-top:8px;justify-content:flex-end;border-top:1px solid #f1f5f9;padding-top:8px;flex-wrap:wrap}
        .card-actions button{border:0;background:0;cursor:pointer;padding:6px 14px;border-radius:6px;font-size:14px;min-height:36px}
        .card-actions .edit-btn{color:#2563eb}
        .card-actions .edit-btn:hover{background:#dbeafe}
        .card-actions .del-btn{color:#dc2626}
        .card-actions .del-btn:hover{background:#fee2e2}
        .auth-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(15,23,42,0.92);display:flex;justify-content:center;align-items:center;z-index:9999}
        .auth-box{background:#fff;border-radius:24px;padding:30px 24px;width:92%;max-width:380px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.3)}
        .auth-box .auth-icon{font-size:48px;margin-bottom:8px}
        .auth-box h2{font-size:20px;color:#1e293b;margin-bottom:4px}
        .auth-box p{color:#64748b;font-size:14px;margin-bottom:14px}
        .auth-box input{width:100%;padding:14px;font-size:18px;text-align:center;border:2px solid #e2e8f0;border-radius:14px;margin:8px 0;box-sizing:border-box}
        .auth-box input:focus{border-color:#3b82f6;outline:0}
        .hidden{display:none!important}
        .err{color:#dc2626;font-size:13px;min-height:20px}
        .hint{color:#94a3b8;font-size:12px;margin-top:6px}
        .empty-state{color:#94a3b8;text-align:center;padding:30px}
        .edit-mode{border-color:#3b82f6!important;box-shadow:0 0 0 3px rgba(59,130,246,0.2)}
        .badge{display:inline-block;background:#f1f5f9;color:#475569;padding:2px 8px;border-radius:4px;font-size:11px;margin-left:4px}
        .loading{display:flex;justify-content:center;align-items:center;padding:30px;gap:10px;color:#64748b}
        .loading .spinner{width:20px;height:20px;border:3px solid #e2e8f0;border-top-color:#3b82f6;border-radius:50%;animation:spin 0.8s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}
        @media (max-width:480px){body{padding:8px}.app{padding:12px;border-radius:16px}.app-title h1{font-size:16px}.inp{flex:1 1 100%;min-width:100%}.inp input{font-size:16px;padding:12px}.toolbar button{font-size:13px;padding:6px 10px;min-height:36px}.btn{padding:10px 16px;font-size:14px;min-height:40px}}
    </style>
</head>
<body>

<div id="loadingScreen" class="auth-overlay">
    <div class="auth-box">
        <div class="auth-icon">📋</div>
        <h2>Журнал передачи смен</h2>
        <div class="loading">
            <div class="spinner"></div>
            <span>Загрузка данных...</span>
        </div>
    </div>
</div>

<div id="auth" class="auth-overlay hidden">
    <div class="auth-box">
        <div class="auth-icon">📋</div>
        <h2 id="authTitle">Создайте пароль</h2>
        <p id="authDesc" style="color:#64748b;">Придумайте пароль для шифрования данных</p>
        <input type="password" id="pass" placeholder="......" maxlength="20">
        <div class="err" id="err"></div>
        <button class="btn btn-blue" id="login" style="width:100%;padding:14px;font-size:16px;">Создать</button>
        <button class="btn btn-red" id="reset" style="width:100%;margin-top:8px;display:none;padding:14px;">Сбросить всё</button>
        <div class="hint" id="hint">Минимум 4 символа</div>
    </div>
</div>

<div id="app" class="app hidden">
    <div class="app-header">
        <div class="app-title">
            <span class="icon">📋</span>
            <div>
                <h1>Журнал передачи смен</h1>
                <span class="subtitle">📌 Общие данные для всех</span>
            </div>
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
            <button class="btn btn-yellow" onclick="syncData()" style="font-size:11px;padding:4px 12px;min-height:32px;">🔄 Синхронизировать</button>
            <button class="btn btn-green" onclick="clearAll()" style="font-size:11px;padding:4px 12px;min-height:32px;">🗑 Очистить всё</button>
            <button class="btn btn-red" onclick="logout()" style="font-size:11px;padding:4px 12px;min-height:32px;">🚪 Выйти</button>
        </div>
    </div>
    
    <div class="row">
        <div class="inp"><label>👤 ФИО</label><input id="fio" placeholder="Иванов Иван"></div>
        <div class="inp" style="flex:0.6;min-width:100px"><label>🐾 Кличка</label><input id="nick" placeholder="Fox"></div>
        <div class="inp" style="flex:0.7;min-width:120px"><label>📅 Дата</label><input type="date" id="date"></div>
    </div>
    
    <label style="font-size:12px;color:#666;font-weight:600;display:block;margin-bottom:4px;">📝 Описание</label>
    <div class="toolbar">
        <button type="button" data-cmd="bold"><b>B</b></button>
        <button type="button" data-cmd="italic"><i>I</i></button>
        <button type="button" data-cmd="underline"><u>U</u></button>
        <span class="sep">|</span>
        <button type="button" onclick="insertList('•')">• Список</button>
        <button type="button" onclick="insertList('1.')">1. Список</button>
        <span class="sep">|</span>
        <button type="button" onclick="addImg()" style="color:#2563eb;">🔗 Ссылка</button>
        <span class="sep">|</span>
        <button type="button" onclick="clearEditorFormat()" style="color:#dc2626;">🧹 Очистить</button>
    </div>
    <div id="editor" contenteditable="true"></div>
    
    <div style="margin-top:10px;display:flex;gap:5px;flex-wrap:wrap;">
        <button class="btn btn-blue" onclick="add()">➕ Добавить</button>
        <button class="btn btn-white" onclick="clearForm()">🧹 Очистить всё</button>
        <button class="btn btn-white" onclick="exportData()">📤 Экспорт</button>
        <span id="editId" style="display:none;"></span>
        <button class="btn btn-blue" id="updateBtn" style="display:none;background:#2563eb;" onclick="update()">💾 Обновить</button>
        <button class="btn btn-white" id="cancelBtn" style="display:none;" onclick="cancelEdit()">❌ Отмена</button>
    </div>
    
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:20px;flex-wrap:wrap;gap:8px;">
        <h2 style="font-size:16px;color:#1e293b;">📖 Последние записи</h2>
        <span id="syncStatus" style="font-size:11px;color:#94a3b8;"></span>
    </div>
    <div id="list" class="list"></div>
</div>

<script>
// ===== НАСТРОЙКА APPSCRIPT =====
// ⚠️ СЮДА ВСТАВЬТЕ ВАШ URL ИЗ APPSCRIPT
var APPSCRIPT_URL = 'https://script.google.com/macros/s/ВАШ_ID/exec';

// ===== ПЕРЕМЕННЫЕ =====
var PK = 'jp';
var DK = 'jd';
var pw = null;
var editingId = null;
var entries = [];

// ===== ШИФРОВАНИЕ =====
function utf8ToBase64(str) {
    var bytes = new TextEncoder().encode(str);
    var binary = '';
    for (var i = 0; i < bytes.length; i++) {
        binary += String.fromCharCode(bytes[i]);
    }
    return btoa(binary);
}

function base64ToUtf8(base64) {
    try {
        var binary = atob(base64);
        var bytes = new Uint8Array(binary.length);
        for (var i = 0; i < binary.length; i++) {
            bytes[i] = binary.charCodeAt(i);
