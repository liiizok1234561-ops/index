<script>
// ===== БЕЗОПАСНОЕ ХРАНЕНИЕ КЛЮЧА (РАЗБИТ НА ЧАСТИ) =====
var _a = 'AIza';
var _b = 'SyBRzcN_oDao1-rOLRMtBY9OfceL1w2HbbI';
var GOOGLE_API_KEY = _a + _b;

const SPREADSHEET_ID = '1GpP5N7uwajcxrH-Iq8_vPIvnG3AD4ecdedb5Uf79Wjw';
const SHEET_NAME = 'Лист1';

// ===== ПЕРЕМЕННЫЕ =====
var PK = 'jp';
var DK = 'jd';
var pw = null;
var editingId = null;
var entries = [];

// ===== ШИФРОВАНИЕ =====
function utf8ToBase64(str) {
    var bytes = new TextEncoder().encode(str);
    var binary = '';
    for (var i = 0; i < bytes.length; i++) {
        binary += String.fromCharCode(bytes[i]);
    }
    return btoa(binary);
}

function base64ToUtf8(base64) {
    try {
        var binary = atob(base64);
        var bytes = new Uint8Array(binary.length);
        for (var i = 0; i < binary.length; i++) {
            bytes[i] = binary.charCodeAt(i);
        }
        return new TextDecoder().decode(bytes);
    } catch (e) {
        return null;
    }
}

function xor(s, k) {
    var r = '';
    for (var i = 0; i < s.length; i++) {
        r += String.fromCharCode(s.charCodeAt(i) ^ k.charCodeAt(i % k.length));
    }
    return r;
}

function enc(d, p) {
    return utf8ToBase64(xor(d, p));
}

function dec(d, p) {
    try {
        var x = base64ToUtf8(d);
        if (x === null) return null;
        return xor(x, p);
    } catch (e) {
        return null;
    }
}

// ===== РАБОТА С GOOGLE =====
function callGoogle(method, url, data) {
    return fetch(url, {
        method: method || 'GET',
        headers: { 'Content-Type': 'application/json' },
        body: data ? JSON.stringify(data) : undefined
    })
    .then(function(res) {
        if (!res.ok) throw new Error('Ошибка: ' + res.status);
        return res.json();
    });
}

function loadFromGoogle() {
    document.getElementById('syncStatus').textContent = '⏳ Загрузка...';
    var url = 'https://sheets.googleapis.com/v4/spreadsheets/' + SPREADSHEET_ID + '/values/' + SHEET_NAME + '?key=' + GOOGLE_API_KEY;
    
    return fetch(url)
        .then(function(res) {
            if (!res.ok) throw new Error('Ошибка загрузки: ' + res.status);
            return res.json();
        })
        .then(function(data) {
            var rows = data.values || [];
            if (rows.length < 2) {
                entries = [];
                document.getElementById('syncStatus').textContent = '✅ Таблица пуста';
                render();
                return entries;
            }
            var result = [];
            for (var i = 1; i < rows.length; i++) {
                var row = rows[i];
                result.push({
                    id: row[0] || String(Date.now() + i),
                    fullName: row[1] || '',
                    nickname: row[2] || '',
                    date: row[3] || '',
                    html: row[4] || ''
                });
            }
            entries = result;
            document.getElementById('syncStatus').textContent = '✅ Загружено ' + entries.length + ' записей';
            render();
            return entries;
        })
        .catch(function(err) {
            document.getElementById('syncStatus').textContent = '❌ Ошибка загрузки';
            var local = loadData();
            if (local.length) {
                entries = local;
                render();
            }
            return entries;
        });
}

function saveToGoogle(entry) {
    var url = 'https://sheets.googleapis.com/v4/spreadsheets/' + SPREADSHEET_ID + '/values/' + SHEET_NAME + ':append?valueInputOption=USER_ENTERED&key=' + GOOGLE_API_KEY;
    var row = [
        entry.id || String(Date.now() + Math.random()),
        entry.fullName,
        entry.nickname || '',
        entry.date || '',
        entry.html || ''
    ];
    return fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ values: [row] })
    })
    .then(function(res) {
        if (!res.ok) throw new Error('Ошибка сохранения: ' + res.status);
        return res.json();
    });
}

function deleteFromGoogle(id) {
    var url = 'https://sheets.googleapis.com/v4/spreadsheets/' + SPREADSHEET_ID + '/values/' + SHEET_NAME + '?key=' + GOOGLE_API_KEY;
    return fetch(url)
        .then(function(res) { return res.json(); })
        .then(function(data) {
            var rows = data.values || [];
            if (rows.length < 2) return;
            var rowIndex = -1;
            for (var i = 1; i < rows.length; i++) {
                if (rows[i][0] === id) { rowIndex = i; break; }
            }
            if (rowIndex === -1) throw new Error('Запись не найдена');
            var range = SHEET_NAME + '!A' + (rowIndex + 1) + ':E' + (rowIndex + 1);
            var delUrl = 'https://sheets.googleapis.com/v4/spreadsheets/' + SPREADSHEET_ID + '/values/' + range + ':clear?key=' + GOOGLE_API_KEY;
            return fetch(delUrl, { method: 'POST' })
                .then(function(res) {
                    if (!res.ok) throw new Error('Ошибка удаления');
                    return { success: true };
                });
        });
}

function updateInGoogle(entry) {
    var url = 'https://sheets.googleapis.com/v4/spreadsheets/' + SPREADSHEET_ID + '/values/' + SHEET_NAME + '?key=' + GOOGLE_API_KEY;
    return fetch(url)
        .then(function(res) { return res.json(); })
        .then(function(data) {
            var rows = data.values || [];
            if (rows.length < 2) throw new Error('Нет данных');
            var rowIndex = -1;
            for (var i = 1; i < rows.length; i++) {
                if (rows[i][0] === entry.id) { rowIndex = i; break; }
            }
            if (rowIndex === -1) throw new Error('Запись не найдена');
            var range = SHEET_NAME + '!A' + (rowIndex + 1) + ':E' + (rowIndex + 1);
            var updUrl = 'https://sheets.googleapis.com/v4/spreadsheets/' + SPREADSHEET_ID + '/values/' + range + '?valueInputOption=USER_ENTERED&key=' + GOOGLE_API_KEY;
            var rowData = [
                entry.id,
                entry.fullName,
                entry.nickname || '',
                entry.date || '',
                entry.html || ''
            ];
            return fetch(updUrl, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ values: [rowData] })
            })
            .then(function(res) {
                if (!res.ok) throw new Error('Ошибка обновления');
                return res.json();
            });
        });
}

function clearGoogleSheet() {
    var url = 'https://sheets.googleapis.com/v4/spreadsheets/' + SPREADSHEET_ID + '/values/' + SHEET_NAME + ':clear?key=' + GOOGLE_API_KEY;
    return fetch(url, { method: 'POST' })
        .then(function(res) {
            if (!res.ok) throw new Error('Ошибка очистки');
            return res.json();
        });
}

// ===== ЛОКАЛЬНОЕ ХРАНЕНИЕ =====
function loadData() {
    if (!pw) return [];
    var d = localStorage.getItem(DK);
    if (!d) return [];
    var t = dec(d, pw);
    if (t === null) return [];
    try { return JSON.parse(t); } catch (e) { return []; }
}

function saveData(arr) {
    if (!pw) return;
    localStorage.setItem(DK, enc(JSON.stringify(arr), pw));
}

// ===== ОСНОВНЫЕ ФУНКЦИИ =====
function today(){var t=new Date();var m=String(t.getMonth()+1);var d=String(t.getDate());if(m.length<2)m='0'+m;if(d.length<2)d='0'+d;return t.getFullYear()+'-'+m+'-'+d;}
function fmtDate(d){if(!d)return '';var p=d.split('-');return p[2]+'.'+p[1]+'.'+p[0];}
function fmtDateFull(d){if(!d)return '';var p=d.split('-');var months=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];return p[2]+' '+months[parseInt(p[1])-1]+' '+p[0];}
function genId(){return Date.now().toString(36)+Math.random().toString(36).substr(2,5);}
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function getPlainText(html){var temp=document.createElement('div');temp.innerHTML=html;var text=temp.textContent||temp.innerText||'';text=text.replace(/^\d+\.\s*/gm,'');text=text.replace(/^[\s]*[•\-*]\s*/gm,'');text=text.replace(/\s+/g,' ').trim();return text;}
function getPreview(html){var plain=getPlainText(html);if(!plain)return '📝 (пусто)';if(plain.length<=70)return plain;return plain.substring(0,70)+'...';}
function hasContent(html){return getPlainText(html).length>0;}
function formatText(html){var text=html;text=text.replace(/([а-яА-Яa-zA-Z])([А-ЯA-Z])/g,function(match,p1,p2){if(match.indexOf('<')!==-1)return match;return p1+' '+p2;});return text;}
function insertList(type){var editor=document.getElementById('editor');editor.focus();var sel=window.getSelection();var range=sel.getRangeAt(0);var text=type+' ';document.execCommand('insertText',false,text);}
function addImg(){var u=prompt('Введите ссылку на изображение:');if(u&&u.trim()){var url=u.trim();document.getElementById('editor').focus();document.execCommand('insertHTML',false,'<a href="'+url+'" target="_blank" style="display:inline-block;padding:8px 16px;background:#eff6ff;border-radius:8px;color:#2563eb;text-decoration:none;font-size:14px;border:1px solid #bfdbfe;">🖼 Открыть изображение</a>');}}

function render() {
    var list = document.getElementById('list');
    if (!entries.length) {
        list.innerHTML = '<div class="empty-state">📭 Нет записей</div>';
        return;
    }
    var sorted = entries.slice().sort(function(a, b) {
        if (a.date < b.date) return 1;
        if (a.date > b.date) return -1;
        return 0;
    });
    var groups = {};
    for (var i = 0; i < sorted.length; i++) {
        var date = sorted[i].date;
        if (!groups[date]) groups[date] = [];
        groups[date].push(sorted[i]);
    }
    var html = '';
    var dates = Object.keys(groups).sort(function(a, b) {
        if (a < b) return 1;
        if (a > b) return -1;
        return 0;
    });
    for (var g = 0; g < dates.length; g++) {
        var date = dates[g];
        var items = groups[date];
        var dateDisplay = fmtDateFull(date);
        var count = items.length;
        var word = 'записей';
        if (count === 1) word = 'запись';
        if (count >= 2 && count <= 4) word = 'записи';
        html += '<div class="date-group" data-date="' + date + '">';
        html += '<div class="date-header" onclick="toggleGroup(this)">';
        html += '<span class="date-label">📅 ' + dateDisplay + '</span>';
        html += '<span style="display:flex;align-items:center;gap:10px;">';
        html += '<span class="date-count">' + count + ' ' + word + '</span>';
        html += '<span class="date-arrow">▼</span>';
        html += '</span></div>';
        html += '<div class="date-entries open">';
        for (var j = 0; j < items.length; j++) {
            var x = items[j];
            var preview = getPreview(x.html);
            var hasList = x.html.indexOf('•') !== -1 || x.html.indexOf('1.') !== -1;
            var hasImg = x.html.indexOf('target="_blank"') !== -1;
            var badges = '';
            if (hasList) badges += ' <span class="badge">📋 список</span>';
            if (hasImg) badges += ' <span class="badge">🔗 ссылка</span>';
            html += '<div class="card" data-id="' + x.id + '">';
            html += '<div class="card-header">';
            html += '<div><span class="card-name">' + esc(x.fullName) + '</span>';
            if (x.nickname) html += ' <span class="card-nick">' + esc(x.nickname) + '</span>';
            html += '</div>';
            html += '</div>';
            html += '<div class="card-preview" onclick="toggleBody(this, \'' + x.id + '\')">' + esc(preview) + badges + '</div>';
            html += '<div class="card-body" id="body-' + x.id + '">' + x.html + '</div>';
            html += '<div class="card-actions">';
            html += '<button class="edit-btn" onclick="edit(\'' + x.id + '\')">✏️ Редактировать</button>';
            html += '<button class="del-btn" onclick="del(\'' + x.id + '\')">🗑 Удалить</button>';
            html += '</div></div>';
        }
        html += '</div></div>';
    }
    list.innerHTML = html;
}

function toggleGroup(el) {
    var entries = el.nextElementSibling;
    var arrow = el.querySelector('.date-arrow');
    if (entries.classList.contains('open')) {
        entries.classList.remove('open');
        arrow.classList.remove('open');
    } else {
        entries.classList.add('open');
        arrow.classList.add('open');
    }
}

function toggleBody(el, id) {
    var body = document.getElementById('body-' + id);
    if (!body) return;
    if (body.classList.contains('show')) {
        body.classList.remove('show');
        el.innerHTML = el.dataset.preview || '';
    } else {
        body.classList.add('show');
        el.dataset.preview = el.textContent;
        el.innerHTML = '▲ Скрыть';
    }
}

function del(id) {
    if (!confirm('🗑 Удалить запись?')) return;
    deleteFromGoogle(id).then(function() {
        entries = entries.filter(function(x) { return x.id !== id; });
        render();
        document.getElementById('syncStatus').textContent = '✅ Запись удалена';
        saveData(entries);
    }).catch(function(err) {
        alert('❌ Ошибка удаления: ' + err.message);
    });
}

function edit(id) {
    var entry = null;
    for (var i = 0; i < entries.length; i++) {
        if (entries[i].id === id) { entry = entries[i]; break; }
    }
    if (!entry) return;
    editingId = id;
    document.getElementById('fio').value = entry.fullName;
    document.getElementById('nick').value = entry.nickname || '';
    document.getElementById('date').value = entry.date;
    document.getElementById('editor').innerHTML = entry.html;
    document.getElementById('editor').classList.add('edit-mode');
    document.getElementById('updateBtn').style.display = 'inline-block';
    document.getElementById('cancelBtn').style.display = 'inline-block';
    document.getElementById('editId').textContent = id;
    document.querySelector('.btn-blue:not(#updateBtn)').style.display = 'none';
    document.getElementById('editor').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function update() {
    var f = document.getElementById('fio').value.trim();
    var n = document.getElementById('nick').value.trim();
    var d = document.getElementById('date').value;
    var h = document.getElementById('editor').innerHTML.trim();
    var id = document.getElementById('editId').textContent;
    if (!f) { alert('Введите ФИО'); return; }
    if (!d) { alert('Укажите дату'); return; }
    if (!h || !hasContent(h)) { alert('Добавьте описание'); return; }
    var formattedHtml = formatText(h);
    var entry = { id: id, fullName: f, nickname: n, date: d, html: formattedHtml };
    updateInGoogle(entry).then(function() {
        for (var i = 0; i < entries.length; i++) {
            if (entries[i].id === id) { entries[i] = entry; break; }
        }
        render();
        cancelEdit();
        document.getElementById('syncStatus').textContent = '✅ Запись обновлена';
        saveData(entries);
    }).catch(function(err) {
        alert('❌ Ошибка обновления: ' + err.message);
    });
}

function cancelEdit() {
    editingId = null;
    document.getElementById('editor').classList.remove('edit-mode');
    document.getElementById('updateBtn').style.display = 'none';
    document.getElementById('cancelBtn').style.display = 'none';
    document.getElementById('editId').textContent = '';
    var btn = document.querySelector('.btn-blue:not(#updateBtn)');
    if (btn) btn.style.display = 'inline-block';
    clearForm();
}

function add() {
    var f = document.getElementById('fio').value.trim();
    var n = document.getElementById('nick').value.trim();
    var d = document.getElementById('date').value;
    var h = document.getElementById('editor').innerHTML.trim();
    if (!f) { alert('Введите ФИО'); return; }
    if (!d) { alert('Укажите дату'); return; }
    if (!h || !hasContent(h)) { alert('Добавьте описание'); return; }
    var formattedHtml = formatText(h);
    var newEntry = { id: genId(), fullName: f, nickname: n, date: d, html: formattedHtml };
    document.getElementById('syncStatus').textContent = '⏳ Сохранение...';
    saveToGoogle(newEntry).then(function() {
        entries.unshift(newEntry);
        render();
        clearForm();
        document.getElementById('syncStatus').textContent = '✅ Запись сохранена';
        saveData(entries);
    }).catch(function(err) {
        alert('❌ Ошибка сохранения: ' + err.message);
        document.getElementById('syncStatus').textContent = '❌ Ошибка сохранения';
    });
}

function clearForm() {
    document.getElementById('fio').value = '';
    document.getElementById('nick').value = '';
    document.getElementById('date').value = today();
    document.getElementById('editor').innerHTML = '';
    if (editingId) cancelEdit();
}

function clearAll() {
    if (!confirm('⚠️ Удалить ВСЕ записи?')) return;
    if (!confirm('Точно?')) return;
    clearGoogleSheet().then(function() {
        entries = [];
        render();
        saveData(entries);
        document.getElementById('syncStatus').textContent = '✅ Все записи удалены';
    }).catch(function(err) {
        alert('❌ Ошибка очистки: ' + err.message);
    });
}

function clearEditorFormat() {
    document.getElementById('editor').focus();
    document.execCommand('removeFormat', false, null);
}

function syncData() {
    loadFromGoogle().then(function() {
        render();
        saveData(entries);
    }).catch(function(err) {
        alert('❌ Ошибка синхронизации: ' + err.message);
    });
}

function exportData() {
    if (!entries.length) { alert('Нет записей'); return; }
    var sorted = entries.slice().sort(function(a, b) {
        if (a.date < b.date) return 1;
        if (a.date > b.date) return -1;
        return 0;
    });
    var text = 'ЖУРНАЛ ПЕРЕДАЧИ СМЕН\n' + '='.repeat(50) + '\n\n';
    for (var i = 0; i < sorted.length; i++) {
        var x = sorted[i];
        text += fmtDate(x.date) + ' | ' + x.fullName + (x.nickname ? ' (' + x.nickname + ')' : '') + '\n';
        text += '   ' + getPlainText(x.html) + '\n\n';
    }
    var blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'journal_' + today() + '.txt';
    a.click();
}

function logout() {
    if (confirm('Выйти?')) {
        pw = null;
        location.reload();
    }
}

// ===== ФОРМАТИРОВАНИЕ =====
var formatBtns = document.querySelectorAll('[data-cmd]');
for (var i = 0; i < formatBtns.length; i++) {
    (function(btn) {
        btn.addEventListener('click', function() {
            var cmd = this.dataset.cmd;
            document.getElementById('editor').focus();
            document.execCommand(cmd, false, null);
            setTimeout(function() {
                try {
                    if (document.queryCommandState(cmd)) {
                        btn.classList.add('active');
                    } else {
                        btn.classList.remove('active');
                    }
                } catch(e) {}
            }, 10);
        });
    })(formatBtns[i]);
}

// ===== АВТОРИЗАЦИЯ =====
document.getElementById('date').value = today();

var sp = localStorage.getItem(PK);

if (sp) {
    document.getElementById('authTitle').textContent = 'Введите пароль';
    document.getElementById('authDesc').textContent = 'Данные зашифрованы';
    document.getElementById('login').textContent = 'Войти';
    document.getElementById('hint').textContent = 'Введите ваш пароль';
    document.getElementById('reset').style.display = 'block';
} else {
    document.getElementById('authTitle').textContent = 'Создайте пароль';
    document.getElementById('authDesc').textContent = 'Придумайте пароль для шифрования';
    document.getElementById('login').textContent = 'Создать';
    document.getElementById('hint').textContent = 'Минимум 4 символа';
    document.getElementById('reset').style.display = 'none';
}

document.getElementById('login').onclick = function() {
    var p = document.getElementById('pass').value.trim();
    var err = document.getElementById('err');
    err.textContent = '';
    if (p.length < 4) {
        err.textContent = '⚠️ Минимум 4 символа';
        return;
    }
    var hasPassword = localStorage.getItem(PK);
    if (!hasPassword) {
        localStorage.setItem(PK, p);
        localStorage.setItem(DK, enc('[]', p));
        pw = p;
        document.getElementById('pass').value = '';
        enterApp();
        return;
    }
    var stored = localStorage.getItem(DK);
    if (!stored) {
        err.textContent = '❌ Ошибка данных';
        return;
    }
    var decrypted = dec(stored, p);
    if (decrypted === null) {
        err.textContent = '❌ Неверный пароль';
        document.getElementById('pass').value = '';
        document.getElementById('pass').focus();
        return;
    }
    try {
        JSON.parse(decrypted);
        pw = p;
        document.getElementById('pass').value = '';
        enterApp();
    } catch (e) {
        err.textContent = '❌ Неверный пароль';
        document.getElementById('pass').value = '';
        document.getElementById('pass').focus();
    }
};

document.getElementById('pass').onkeydown = function(e) {
    if (e.key === 'Enter') {
        document.getElementById('login').click();
    }
};

document.getElementById('reset').onclick = function() {
    if (confirm('Все данные будут удалены!') && confirm('Точно?')) {
        localStorage.removeItem(PK);
        localStorage.removeItem(DK);
        location.reload();
    }
};

function enterApp() {
    document.getElementById('auth').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    document.getElementById('loadingScreen').classList.add('hidden');
    loadFromGoogle().then(function() {
        saveData(entries);
    }).catch(function() {
        var local = loadData();
        if (local.length) {
            entries = local;
            render();
        }
    });
}

document.getElementById('loadingScreen').classList.remove('hidden');

if (localStorage.getItem(PK)) {
    document.getElementById('loadingScreen').classList.add('hidden');
    document.getElementById('auth').classList.remove('hidden');
} else {
    document.getElementById('loadingScreen').classList.add('hidden');
    document.getElementById('auth').classList.remove('hidden');
}
</script>
